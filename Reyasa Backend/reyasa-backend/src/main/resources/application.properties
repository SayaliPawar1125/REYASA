spring.application.name=reyasa-backend

server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/reyasa_db
spring.datasource.username=root
spring.datasource.password=root123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
reyasa.jwt.secret=${JWT_SECRET}
reyasa.jwt.expiration=86400000

# Security and Request Logging
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

# Homepage Video and Poster Upload Limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

#  Expense Receipt Uploads
reyasa.upload-dir=uploads


razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}


# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth Configuration
google.client-id=${GOOGLE_CLIENT_ID}